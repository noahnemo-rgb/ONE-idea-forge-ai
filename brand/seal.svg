<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="ONE Trust Colophon">
  <title>ONE Trust Colophon</title>
  <rect width="256" height="256" fill="#f7f1e6"/>
  <circle cx="128" cy="128" r="110" fill="none" stroke="#c6a15b" stroke-width="4"/>
  <circle cx="128" cy="128" r="88" fill="none" stroke="#c6a15b" stroke-width="1.5"/>
  <text x="128" y="140" text-anchor="middle" font-family="Palatino Linotype, Palatino, serif" font-size="42" fill="#1a2433">ONE</text>
  <text x="128" y="168" text-anchor="middle" font-family="Source Sans 3, Segoe UI, sans-serif" font-size="9" letter-spacing="2" fill="#2a6f7a">TRUST COLOPHON</text>
  <path id="ring" d="M128,36 A92,92 0 1,1 127.9,36" fill="none"/>
  <text font-family="Palatino Linotype, Palatino, serif" font-size="11" fill="#7a1f2b">
    <textPath href="#ring" startOffset="50%" text-anchor="middle">ALL is One and ONE is All</textPath>
  </text>
</svg>
